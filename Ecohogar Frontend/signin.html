<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Consumo Familiar</title>
  <link rel="stylesheet" href="css/Eco-Style.css">
</head>
<body>

    <img src="css/fondo.png" alt="fondo" id="fondo"> <!--Imagen fondo-->
  <header> <!--Encabezado-->
        <img src="Logo.png" alt="Eco-Logo"> <!--Imagen del logo-->
  </header>

  <div class="signin-container">
    <h1>¡Bienvenido a EcoHogar!</h1><!--Titulo-->
    <h2>Crear cuenta</h2><!--Subtitulo-->
    <h3>Ingrese sus datos y los de su hogar</h3><!--Otro subtitulo-->
    <form id="signinForm"><!--Form-->
      <!-- Datos del Usuario -->
      <h3>Datos del Usuario</h3><!--Titulo-->
      <label for="name">Nombre</label><!--Texto para el input-->
      <input type="text" id="name" name="name" required><!--Input del nombre-->

      <label for="memberQuantity">Cantidad de miembros en la familia</label><!--Titulo para el input-->
      <input type="number" id="memberQuantity" name="memberQuantity" min="1" required><!--Input-->

      <label for="email">Correo electrónico</label><!--Titulo para el input-->
      <input type="email" id="email" name="email" required><!--Input del email-->

      <label for="password">Contraseña</label><!--Titulo para el input-->
      <input type="password" id="password" name="password" required><!--Input de la contraseña-->

      <!-- Datos del EcoService -->
      <h3>Servicio Ecológico</h3>
      <label for="ecoName">Nombre del servicio(Familia)</label><!--Titulo del input-->
      <input type="text" id="ecoName" name="ecoName" required><!--Input para el nombre del servicio-->

      <label for="waterCostPerlit">Costo por un litro de agua</label><!--Titulo del input-->
      <input type="number" step="0.01" id="waterCostPerlit" name="waterCostPerlit" required><!--Input del litros del agua-->

      <label for="hoursOfLightPd">Horas consumidas de luz por día</label><!--Titulo del input-->
      <input type="number" step="0.01" id="hoursOfLightPd" name="hoursOfLightPd" required><!--Hora de luz por día-->

      <label for="lightCostPerHour">Costo por hora de luz</label><!--Titulo del input-->
      <input type="number" step="0.01" id="lightCostPerHour" name="lightCostPerHour" required><!--Costo de luz por hora-->

      <label for="litersOfWaterConsumedPd">Litros de agua consumidos por día</label><!--Titulo del input-->
      <input type="number" step="0.01" id="litersOfWaterConsumedPd" name="litersOfWaterConsumedPd" required><!--Litros de agua consumido por día-->

      <!-- Datos del Device -->
      <h3>Dispositivo</h3>
      <label for="deviceName">Nombre del dispositivo</label><!--Titulo del input-->
      <input type="text" id="deviceName" name="deviceName" required><!--Nombre del dispositivo-->

      <label for="usedLight">Consumo de luz del dispositivo</label><!--Titulo del input-->
      <input type="number" step="0.01" id="usedLight" name="usedLight" required><!--Luz usada-->

      <label for="quantity">Cantidad</label><!--Titulo del input-->
      <input type="number" step="0.01" id="quantity" name="quantity" required><!--Cantidad-->

      <button type="submit">Registrar</button><!--Botón para registrar-->
    </form>
    <p id="message"></p><!--Parrafo-->
    <p>¿Ya tienes cuenta? tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </form>
  </div>

  <footer>
    UCR 2026 <br>
    Melbin, Jean Narco, Loco95, Giornomar, Charlos <br>
    Proyecto Programación
  </footer>

  <script src="js/signinScript.js"></script>
</body>
</html>
