<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Consumo Familiar</title>
  <link rel="stylesheet" href="css/Eco-Style.css">
</head>
<body>

  <header>
        <img src="Logo.png" alt="Eco-Logo">
  </header>

  <div class="signin-container">
    <h1>¡Bienvenido a EcoHogar!</h1>
    <h2>Crear cuenta</h2>
    <h3>Ingrese sus datos y los de su hogar</h3>
    <form id="signinForm">
      <!-- Datos del Usuario -->
      <h3>Datos del Usuario</h3>
      <label for="name">Nombre</label>
      <input type="text" id="name" name="name" required>

      <label for="memberQuantity">Cantidad de miembros</label>
      <input type="number" id="memberQuantity" name="memberQuantity" min="1" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <!-- Datos del EcoService -->
      <h3>Servicio Ecológico</h3>
      <label for="ecoName">Nombre del servicio</label>
      <input type="text" id="ecoName" name="ecoName" required>

      <label for="waterCostPerlit">Costo por litro de agua</label>
      <input type="number" step="0.01" id="waterCostPerlit" name="waterCostPerlit" required>

      <label for="hoursOfLightPd">Horas de luz por día</label>
      <input type="number" step="0.01" id="hoursOfLightPd" name="hoursOfLightPd" required>

      <label for="lightCostPerHour">Costo por hora de luz</label>
      <input type="number" step="0.01" id="lightCostPerHour" name="lightCostPerHour" required>

      <label for="litersOfWaterConsumedPd">Litros de agua consumidos por día</label>
      <input type="number" step="0.01" id="litersOfWaterConsumedPd" name="litersOfWaterConsumedPd" required>

      <!-- Datos del Device -->
      <h3>Dispositivo</h3>
      <label for="deviceName">Nombre del dispositivo</label>
      <input type="text" id="deviceName" name="deviceName" required>

      <label for="usedLight">Consumo de luz del dispositivo</label>
      <input type="number" step="0.01" id="usedLight" name="usedLight" required>

      <label for="quantity">Cantidad</label>
      <input type="number" step="0.01" id="quantity" name="quantity" required>

      <button type="submit">Registrar</button>
    </form>
    <p id="message"></p>
    <p>¿Ya tienes cuenta? tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </form>
  </div>

</body>
</html>
