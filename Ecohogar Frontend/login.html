<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Consumo Familiar</title>
  <link rel="stylesheet" href="css/Eco-Style.css">
</head>
<body>

  <img src="css/fondo.png" alt="fondo" id="fondo">
  <header>
      <img src="Logo.png" alt="Eco-Logo">
  </header>
  <div class="login-container">
    <h1>¡Bienvenido de nuevo!</h1>
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="********" required>

      <button type="submit">Ingresar</button>

      <p>¿No tienes cuenta? <a href="signin.html">Crea una aquí</a></p>
    </form>
    <p id="message"></p>
  </div>
  
  <footer>
    UCR 2026 <br>
    Melbin, Jean Narco, Loco95, Giornomar, Charlos <br>
    Proyecto Programación
  </footer>
</body>
</html>
