<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Consumo Familiar</title>
  <link rel="stylesheet" href="css/Eco-Style.css">
</head>
<body>

  <header><!--El header de la página-->
      <img src="Logo.png" alt="Eco-Logo"><!--Imagen introducida-->
  </header>
  <div class="login-container"><!--Div contenedor-->
    <h1>¡Bienvenido de nuevo!</h1><!--Titulo-->
    <h2>Iniciar sesión</h2><!--Subtitulo-->
    <form id="loginForm"><!--Un form que obtiene el email-->
      <label for="email">Correo electrónico</label><!--Texto del input-->
      <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required><!--Input-->

      <label for="password">Contraseña</label><!--Texto del input-->
      <input type="password" id="password" name="password" placeholder="********" required><!--Input-->

      <button type="submit">Ingresar</button><!--Botón-->

      <p>¿No tienes cuenta? <a href="signin.html">Crea una aquí</a></p><!--Párrafo para registrarse-->
    </form>
    <p id="message"></p><!--Párrafo-->
  </div>

</body>
</html>
